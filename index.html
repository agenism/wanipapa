<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 서울·경기 돌잔치 장소 가이드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf8f2;
    --blush: #f5e6d3;
    --rose: #e8a89c;
    --deep-rose: #c4756a;
    --burgundy: #7a3d3d;
    --gold: #d4a843;
    --warm-gray: #6b5c5c;
    --dark: #2d1f1f;
    --white: #ffffff;
    --shadow: rgba(45,31,31,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--cream);
    color: var(--dark);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 헤더 */
  header {
    background: var(--dark);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 100;
    box-shadow: 0 2px 12px var(--shadow);
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Noto Serif KR', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -0.5px;
  }

  .logo span {
    color: var(--gold);
  }

  .header-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    font-weight: 300;
  }

  .filter-wrap {
    margin-left: auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid rgba(255,255,255,0.2);
    background: transparent;
    color: rgba(255,255,255,0.7);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-btn:hover,
  .filter-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--dark);
    font-weight: 700;
  }

  /* 메인 레이아웃 */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* 사이드 패널 */
  .sidebar {
    width: 360px;
    flex-shrink: 0;
    background: var(--white);
    overflow-y: auto;
    border-right: 1px solid #ede0d4;
    display: flex;
    flex-direction: column;
  }

  .sidebar-header {
    padding: 20px 20px 12px;
    border-bottom: 1px solid #ede0d4;
    background: var(--blush);
    flex-shrink: 0;
  }

  .sidebar-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--burgundy);
  }

  .sidebar-count {
    font-size: 12px;
    color: var(--warm-gray);
    margin-top: 4px;
  }

  .venue-list {
    flex: 1;
    overflow-y: auto;
  }

  .venue-card {
    padding: 16px 20px;
    border-bottom: 1px solid #f5ece4;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .venue-card:hover {
    background: #fdf0e8;
  }

  .venue-card.active {
    background: var(--blush);
    border-left: 3px solid var(--deep-rose);
  }

  .venue-type-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 10px;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }

  .type-hotel { background: #fde8e8; color: #c0392b; }
  .type-wedding { background: #e8f4fd; color: #1a5276; }
  .type-convention { background: #fef9e7; color: #d68910; }
  .type-boutique { background: #e8fdf0; color: #1e8449; }

  .venue-name {
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 4px;
  }

  .venue-location {
    font-size: 12px;
    color: var(--warm-gray);
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 6px;
  }

  .venue-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .venue-tag {
    font-size: 11px;
    color: var(--deep-rose);
    background: #fdf0ed;
    padding: 2px 8px;
    border-radius: 8px;
  }

  .venue-price {
    font-size: 12px;
    color: var(--gold);
    font-weight: 700;
    margin-top: 6px;
  }

  /* 지도 영역 */
  .map-area {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .map-svg-wrap {
    width: 100%;
    height: 100%;
    position: relative;
  }

  svg.map {
    width: 100%;
    height: 100%;
  }

  /* 마커 */
  .marker-group {
    cursor: pointer;
  }

  .marker-circle {
    transition: all 0.2s;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }

  .marker-group:hover .marker-circle,
  .marker-group.active .marker-circle {
    transform-origin: center;
  }

  .marker-label {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 11px;
    font-weight: 700;
    pointer-events: none;
    user-select: none;
  }

  /* 상세 팝업 */
  .detail-panel {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 320px;
    background: var(--white);
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(45,31,31,0.18);
    overflow: hidden;
    z-index: 50;
    transform: translateX(360px);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-height: calc(100vh - 120px);
    overflow-y: auto;
  }

  .detail-panel.open {
    transform: translateX(0);
  }

  .detail-header {
    padding: 20px 20px 14px;
    background: linear-gradient(135deg, var(--dark) 0%, var(--burgundy) 100%);
    position: relative;
  }

  .detail-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .detail-type-badge {
    font-size: 10px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .detail-name {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--white);
    line-height: 1.3;
  }

  .detail-location {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .detail-body {
    padding: 16px 20px;
  }

  .detail-section {
    margin-bottom: 16px;
  }

  .detail-section-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--warm-gray);
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .detail-desc {
    font-size: 13px;
    line-height: 1.7;
    color: var(--dark);
  }

  .detail-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .info-item {
    background: var(--blush);
    border-radius: 10px;
    padding: 10px 12px;
  }

  .info-label {
    font-size: 10px;
    color: var(--warm-gray);
    font-weight: 700;
    margin-bottom: 2px;
  }

  .info-value {
    font-size: 13px;
    font-weight: 700;
    color: var(--dark);
  }

  .info-value.gold { color: var(--gold); }

  .feature-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .feature-tag {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 10px;
    background: #fdf0ed;
    color: var(--deep-rose);
    font-weight: 500;
  }

  .pros-list {
    list-style: none;
  }

  .pros-list li {
    font-size: 13px;
    color: var(--dark);
    padding: 4px 0;
    display: flex;
    align-items: flex-start;
    gap: 6px;
    line-height: 1.5;
  }

  .pros-list li::before {
    content: '✓';
    color: var(--deep-rose);
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* 지도 배경 스타일 */
  .map-bg { fill: #e8f0e8; }
  .map-water { fill: #b8d4e8; }
  .map-road { stroke: #ffffff; stroke-width: 1.5; fill: none; opacity: 0.6; }
  .map-border { stroke: #c8b8b8; stroke-width: 1; fill: none; }
  .district-label { fill: #8a7a7a; font-size: 10px; font-family: 'Noto Sans KR', sans-serif; }

  /* 범례 */
  .legend {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: white;
    border-radius: 12px;
    padding: 12px 16px;
    box-shadow: 0 4px 16px var(--shadow);
    z-index: 10;
  }

  .legend-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--warm-gray);
    margin-bottom: 8px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
    font-size: 11px;
    color: var(--dark);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* 스크롤바 */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d4c4c4; border-radius: 2px; }

  /* 선택 없을 때 지도 안내 */
  .map-hint {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(45,31,31,0.8);
    color: white;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 12px;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .map-hint.hidden { opacity: 0; }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">🎂 돌잔치 <span>장소 가이드</span></div>
    <div class="header-sub">서울 · 경기권 주요 장소 한눈에 보기</div>
  </div>
  <div class="filter-wrap">
    <button class="filter-btn active" data-filter="all">전체</button>
    <button class="filter-btn" data-filter="hotel">호텔</button>
    <button class="filter-btn" data-filter="wedding">웨딩홀</button>
    <button class="filter-btn" data-filter="convention">컨벤션</button>
    <button class="filter-btn" data-filter="boutique">소규모</button>
  </div>
</header>

<div class="main">
  <!-- 사이드바 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">🗺️ 장소 목록</div>
      <div class="sidebar-count" id="venueCount">총 14개 장소</div>
    </div>
    <div class="venue-list" id="venueList"></div>
  </div>

  <!-- 지도 -->
  <div class="map-area">
    <div class="map-svg-wrap">
      <svg class="map" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" id="mainMap">
        <!-- 배경 -->
        <rect width="800" height="600" fill="#dde8d8"/>

        <!-- 경기도 배경 영역 -->
        <ellipse cx="400" cy="300" rx="380" ry="270" fill="#e4ede0" opacity="0.8"/>

        <!-- 한강 -->
        <path d="M 60 280 Q 160 265 240 270 Q 320 275 380 268 Q 440 260 520 255 Q 600 250 700 245" 
              stroke="#8fb8d4" stroke-width="8" fill="none" opacity="0.7"/>
        <path d="M 60 286 Q 160 271 240 276 Q 320 281 380 274 Q 440 266 520 261 Q 600 256 700 251" 
              stroke="#a8c8de" stroke-width="4" fill="none" opacity="0.5"/>

        <!-- 서울 영역 표시 -->
        <path d="M 220 200 L 280 180 L 370 185 L 430 190 L 470 210 L 490 250 L 480 290 L 450 320 L 390 335 L 320 330 L 260 320 L 220 295 L 200 260 L 210 225 Z"

        <text x="340" y="215" text-anchor="middle" class="district-label" font-weight="700" fill="#6a5a5a" font-size="13">서울</text>

        <!-- 주요 구 이름 -->
        <text x="290" y="245" text-anchor="middle" class="district-label">강북</text>
        <text x="400" y="240" text-anchor="middle" class="district-label">성동</text>
        <text x="460" y="260" text-anchor="middle" class="district-label">송파</text>
        <text x="280" y="305" text-anchor="middle" class="district-label">강남</text>
        <text x="220" y="250" text-anchor="middle" class="district-label">마포</text>
        <text x="360" y="310" text-anchor="middle" class="district-label">서초</text>

        <!-- 경기도 지역명 -->
        <text x="130" y="200" text-anchor="middle" class="district-label" fill="#5a7a5a">고양</text>
        <text x="120" y="340" text-anchor="middle" class="district-label" fill="#5a7a5a">광명</text>
        <text x="180" y="430" text-anchor="middle" class="district-label" fill="#5a7a5a">수원</text>
        <text x="320" y="410" text-anchor="middle" class="district-label" fill="#5a7a5a">성남</text>
        <text x="460" y="390" text-anchor="middle" class="district-label" fill="#5a7a5a">하남</text>
        <text x="580" y="320" text-anchor="middle" class="district-label" fill="#5a7a5a">구리/남양주</text>
        <text x="600" y="220" text-anchor="middle" class="district-label" fill="#5a7a5a">의정부</text>

        <!-- 도로 표시 -->
        <line x1="340" y1="100" x2="340" y2="500" stroke="white" stroke-width="2" opacity="0.4"/>
        <line x1="100" y1="280" x2="700" y2="270" stroke="white" stroke-width="2" opacity="0.4"/>
        <line x1="200" y1="150" x2="550" y2="420" stroke="white" stroke-width="1.5" opacity="0.3"/>

        <!-- 마커 그룹 (JS로 생성) -->
        <g id="markers"></g>
      </svg>
    </div>

    <!-- 상세 팝업 -->
    <div class="detail-panel" id="detailPanel">
      <div class="detail-header">
        <button class="detail-close" id="closeDetail">×</button>
        <div class="detail-type-badge" id="detailType"></div>
        <div class="detail-name" id="detailName"></div>
        <div class="detail-location" id="detailLocation">📍 <span></span></div>
      </div>
      <div class="detail-body">
        <div class="detail-section">
          <div class="detail-section-title">장소 소개</div>
          <div class="detail-desc" id="detailDesc"></div>
        </div>
        <div class="detail-section">
          <div class="detail-info-grid" id="detailInfoGrid"></div>
        </div>
        <div class="detail-section">
          <div class="detail-section-title">주요 특징</div>
          <div class="feature-tags" id="detailFeatures"></div>
        </div>
        <div class="detail-section">
          <div class="detail-section-title">장점</div>
          <ul class="pros-list" id="detailPros"></ul>
        </div>
      </div>
    </div>

    <!-- 범례 -->
    <div class="legend">
      <div class="legend-title">장소 유형</div>
      <div class="legend-item"><div class="legend-dot" style="background:#c0392b"></div> 특급 호텔</div>
      <div class="legend-item"><div class="legend-dot" style="background:#1a5276"></div> 웨딩홀</div>
      <div class="legend-item"><div class="legend-dot" style="background:#d68910"></div> 컨벤션/연회장</div>
      <div class="legend-item"><div class="legend-dot" style="background:#1e8449"></div> 소규모/부티크</div>
    </div>

    <div class="map-hint" id="mapHint">📍 마커를 클릭해서 상세 정보를 확인하세요</div>
  </div>
</div>

const typeColors = {
  hotel: '#c0392b',
  wedding: '#1a5276',
  convention: '#d68910',
  boutique: '#1e8449'
};

const typeLabels = {
  hotel: '호텔',
  wedding: '웨딩홀',
  convention: '컨벤션',
  boutique: '소규모'
};

let activeFilter = 'all';
let activeVenue = null;

function getFilteredVenues() {
  if (activeFilter === 'all') return venues;
  return venues.filter(v => v.type === activeFilter);
}

function renderVenueList() {
  const list = document.getElementById('venueList');
  const filtered = getFilteredVenues();
  document.getElementById('venueCount').textContent = `총 ${filtered.length}개 장소`;
  
  list.innerHTML = filtered.map(v => `
    <div class="venue-card ${activeVenue === v.id ? 'active' : ''}" data-id="${v.id}" onclick="selectVenue(${v.id})">
      <div class="venue-type-badge type-${v.type}">${v.typeLabel}</div>
      <div class="venue-name">${v.name}</div>
      <div class="venue-location">📍 ${v.region}</div>
      <div class="venue-tags">
        ${v.features.slice(0,3).map(f => `<span class="venue-tag">${f}</span>`).join('')}
      </div>
      <div class="venue-price">💰 ${v.price}</div>
    </div>
  `).join('');
}

function renderMarkers() {
  const markersEl = document.getElementById('markers');
  const filtered = getFilteredVenues();
  
  markersEl.innerHTML = filtered.map(v => `
    <g class="marker-group ${activeVenue === v.id ? 'active' : ''}" data-id="${v.id}" onclick="selectVenue(${v.id})">
      <circle class="marker-circle" cx="${v.cx}" cy="${v.cy}" r="${activeVenue === v.id ? 14 : 11}" 
              fill="${v.color}" stroke="white" stroke-width="2.5"
              opacity="${activeVenue === v.id ? 1 : 0.85}"/>
      <text x="${v.cx}" y="${v.cy + 4}" text-anchor="middle" fill="white" 
            font-size="12" font-weight="700" class="marker-label">
        ${v.type === 'hotel' ? '🏨' : v.type === 'wedding' ? '💒' : v.type === 'convention' ? '🎊' : '✨'}
      </text>
      ${activeVenue === v.id ? `
        <circle cx="${v.cx}" cy="${v.cy}" r="18" fill="none" stroke="${v.color}" stroke-width="2" opacity="0.4">
          <animate attributeName="r" from="14" to="22" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" from="0.5" to="0" dur="1.5s" repeatCount="indefinite"/>
        </circle>
      ` : ''}
    </g>
  `).join('');
}

function selectVenue(id) {
  const venue = venues.find(v => v.id === id);
  if (!venue) return;
  
  activeVenue = id;
  
  // 패널 업데이트
  document.getElementById('detailType').textContent = venue.typeLabel;
  document.getElementById('detailName').textContent = venue.name;
  document.getElementById('detailLocation').querySelector('span').textContent = venue.address;
  document.getElementById('detailDesc').textContent = venue.desc;
  
  document.getElementById('detailInfoGrid').innerHTML = `
    <div class="info-item">
      <div class="info-label">💰 예상 비용</div>
      <div class="info-value gold">${venue.price}</div>
    </div>
    <div class="info-item">
      <div class="info-label">👥 수용 인원</div>
      <div class="info-value">${venue.capacity}</div>
    </div>
    <div class="info-item">
      <div class="info-label">📍 지역</div>
      <div class="info-value">${venue.region}</div>
    </div>
    <div class="info-item">
      <div class="info-label">🏷️ 유형</div>
      <div class="info-value">${venue.typeLabel}</div>
    </div>
  `;
  
  document.getElementById('detailFeatures').innerHTML = venue.features
    .map(f => `<span class="feature-tag">${f}</span>`).join('');
  
  document.getElementById('detailPros').innerHTML = venue.pros
    .map(p => `<li>${p}</li>`).join('');
  
  document.getElementById('detailPanel').classList.add('open');
  document.getElementById('mapHint').classList.add('hidden');
  
  renderVenueList();
  renderMarkers();
}

function closeDetail() {
  activeVenue = null;
  document.getElementById('detailPanel').classList.remove('open');
  document.getElementById('mapHint').classList.remove('hidden');
  renderVenueList();
  renderMarkers();
}

// 필터 버튼
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    activeVenue = null;
    document.getElementById('detailPanel').classList.remove('open');
    document.getElementById('mapHint').classList.remove('hidden');
    renderVenueList();
    renderMarkers();
  });
});

document.getElementById('closeDetail').addEventListener('click', closeDetail);

// 초기 렌더
renderVenueList();
renderMarkers();
</script>
